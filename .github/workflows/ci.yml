name: CI Pipeline

on:
  push:
    branches: [main, staging]  # Run on both main and staging branches

jobs:
  # Backend Tests and Analysis
  backend-tests:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # For SonarCloud

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          cd server
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 bandit

      - name: Lint with flake8 (critical errors only)
        run: |
          cd server
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint with flake8 (all checks)
        continue-on-error: true
        run: |
          cd server
          flake8 . --count --exit-zero --max-line-length=127 --statistics

      - name: Security scan with bandit
        continue-on-error: true
        run: |
          cd server
          bandit -r . -f txt || true

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/server
        run: |
          cd server
          pytest --cov=. --cov-report=xml --cov-report=term-missing --tb=short

      - name: Display coverage results
        run: |
          cd server
          if [ -f coverage.xml ]; then
            echo "✅ Coverage report generated"
            cat coverage.xml | head -20
          else
            echo "⚠️ coverage.xml not found"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v4
        continue-on-error: true
        with:
          files: ./server/coverage.xml
          flags: backend
          name: backend-coverage
          verbose: true

      - name: Set up Java for Sonar scanner
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SonarQube Cloud Scan (Backend)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true  # Sonar JRE/auth 403 must not block tests that already passed
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: server
          args: >
            -Dsonar.projectKey=JordanViber_OptionsTaxHub
            -Dsonar.organization=jordanviber
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.scanner.skipJreProvisioning=true

  # Frontend Tests and Analysis
  frontend-tests:
    name: Frontend Tests & Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29  # v6
        with:
          fetch-depth: 0  # For SonarCloud

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          cd client
          npm install --legacy-peer-deps --no-save --ignore-scripts

      - name: Lint with ESLint
        continue-on-error: true
        run: |
          cd client
          npm run lint 2>&1 || true

      - name: Run unit tests with coverage
        run: |
          cd client
          npm test -- --coverage --watchAll=false --passWithNoTests

      - name: Display coverage files
        run: |
          cd client
          if [ -f coverage/lcov.info ]; then
            echo "✅ lcov.info generated"
            head -10 coverage/lcov.info
          else
            echo "⚠️ lcov.info not found, checking for coverage-final.json"
            find coverage -type f 2>/dev/null || echo "No coverage directory"
          fi

      - name: Build check
        run: |
          cd client
          npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v4
        continue-on-error: true
        with:
          files: ./client/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          verbose: true

      - name: Set up Java for Sonar scanner
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SonarQube Cloud Scan (Frontend)
        id: sonar-frontend
        if: github.ref == 'refs/heads/main'
        continue-on-error: true  # Sonar JRE/auth 403 must not block tests that already passed
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: client
          args: >
            -Dsonar.projectKey=JordanViber_OptionsTaxHub
            -Dsonar.organization=jordanviber
            -Dsonar.sources=app,lib,public
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/tests/**,**/*.test.{js,ts,tsx},**/*.spec.{js,ts,tsx},**/jest.config.js,**/jest.setup.ts,**/postcss.config.js,**/next.config.js,**/playwright.config.ts,**/app/**layout*.tsx
            -Dsonar.coverage.exclusions=**/tests/**,**/*.test.{js,ts,tsx},**/*.spec.{js,ts,tsx},**/jest.config.js,**/jest.setup.ts,**/postcss.config.js,**/next.config.js,**/playwright.config.ts,**/lib/queryClient.ts,**/lib/theme.ts,**/public/sw.js,**/app/hooks/usePushNotifications.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.scanner.skipJreProvisioning=true

      - name: Wait for Quality Gate (Frontend)
        if: github.ref == 'refs/heads/main' && steps.sonar-frontend.outcome == 'success'
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa  # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          scanMetadataReportFile: client/.scannerwork/report-task.txt

  # E2E Tests
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29  # v6

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        run: |
          cd server
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: |
          cd client
          npm install --legacy-peer-deps --no-save --ignore-scripts
          npx playwright install --with-deps

      - name: Start backend server
        run: |
          cd server
          python -m uvicorn main:app --host 0.0.0.0 --port 8011 > /tmp/backend.log 2>&1 &
          sleep 3
        env:
          PYTHONPATH: ${{ github.workspace }}/server
          DATABASE_URL: sqlite:///test.db
          FRONTEND_URL: http://localhost:3000
          PORT: 8011

      - name: Build frontend
        run: |
          cd client
          npm run build

      - name: Start frontend server
        run: |
          cd client
          timeout 30 npm run start > /tmp/frontend.log 2>&1 &
          sleep 5
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8011

      - name: Run Playwright tests
        continue-on-error: true
        run: |
          cd client
          npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v4
        if: always()
        with:
          name: playwright-report
          path: client/test-results/
          retention-days: 30

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v4
        continue-on-error: true
        with:
          name: backend-logs
          path: /tmp/backend.log

      - name: Upload frontend logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v4
        continue-on-error: true
        with:
          name: frontend-logs
          path: /tmp/frontend.log

  # Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29  # v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Ensure Trivy SARIF exists (avoid upload failure)
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[]}' > trivy-results.sarif
            echo "Created placeholder trivy-results.sarif"
          fi
          ls -la trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13  # v3.28.0
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
